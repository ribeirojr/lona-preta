<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lona Preta</title>
<meta name="theme-color" content="#131415">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;700&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
/* Layout: a camp ledger under black tarp: status strip, the land as a soil grid, and a side column of stores, court case, map and log.
   THEMES (see docs/THEMES.md): ":root" is NIGHT (dark, English). ':root[data-theme="bandeira"]' is MODO BANDEIRA (light, flag colours, Portuguese).
   Every colour variable defined in :root must be redefined in the bandeira block unless it is in the "constant" group. scripts/check.mjs enforces this. */
:root{
  /* surfaces and text */
  --tarp:#131415; --tarp-2:#1c1e1f; --tarp-3:#26292a; --line:#363a3b;
  --chalk:#efe7d3; --dim:#a69d89;
  /* semantic colours */
  --clay:#c24a2f;      /* idle land, danger, owner's case */
  --corn:#e9b62c;      /* flag-yellow highlight: harvest button, ready badge */
  --leaf:#77a94b;      /* productive land, your defense */
  --accent:#e9b62c;    /* selection, focus ring, route line, cost numbers */
  --go:#c24a2f;        /* primary button background */
  --brand:#c24a2f;     /* the word "Preta" in the title */
  --scrim:rgba(5,5,5,.78);      /* modal backdrop */
  --pattern:rgba(255,255,255,.012);
  /* constant in both themes: the plots are drawn on brown earth, so their art never changes */
  --soil:#4a2c1d; --soil-2:#5f3a26; --soil-line:#7a4d33;
  --art-leaf:#77a94b; --art-leaf-dim:#4f7434; --art-corn:#e9b62c; --on-dark:#efe7d3;
  --display:"Alfa Slab One", "Rockwell", "Roboto Slab", Georgia, serif;
  --body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
:root[data-theme="bandeira"]{
  --tarp:#f3f6ea; --tarp-2:#ffffff; --tarp-3:#e7efd9; --line:#c3d1ae;
  --chalk:#0d2240; --dim:#4a5a6b;
  --clay:#c8452a; --corn:#fedd00; --leaf:#08873a;
  --accent:#002776; --go:#002776; --brand:#009b3a;
  --scrim:rgba(13,34,64,.55);
  --pattern:rgba(0,39,118,.035);
  color-scheme:light;
}
/* Flag stripe across the top in Modo Bandeira: green, yellow, blue */
:root[data-theme="bandeira"] body::before{content:"";position:fixed;inset:0 0 auto 0;height:6px;z-index:40;
  background:linear-gradient(90deg,#009b3a 0 33.4%,#fedd00 33.4% 66.7%,#002776 66.7%)}
html,body{height:100%}
body{background:var(--tarp);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 28px;
  background-image:repeating-linear-gradient(115deg, transparent 0 22px, var(--pattern) 22px 23px);}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1;margin:0;letter-spacing:.01em}
h1 span{color:var(--brand)}
.tag{color:var(--dim);font-size:13px;max-width:52ch}
.status{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--tarp-2);border:1px solid var(--line);border-radius:4px;padding:5px 9px;font-size:13px;display:flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums}
.chip b{font-size:15px}
.chip.rain{border-color:#3d6a7a}.chip.dry{border-color:#8a6a2a}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--tarp-2);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.landhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.landhead h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--dim)}
.facts b{color:var(--chalk);font-weight:500}
.grid{display:grid;gap:6px}
.plot{aspect-ratio:1;max-width:100%;border-radius:4px;border:2px solid transparent;padding:0;position:relative;
  background:linear-gradient(160deg,var(--soil-2),var(--soil));overflow:hidden}
.plot svg{width:100%;height:100%;display:block}
.plot.sel{border-color:var(--accent)}
.plot .badge{position:absolute;left:4px;bottom:3px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.55);color:var(--on-dark);padding:1px 5px;border-radius:3px}
.plot.ready .badge{background:var(--corn);color:#2a1d05;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;align-items:center}
.btn{background:var(--tarp-3);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:14px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--dim)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{background:var(--go);border-color:var(--go);color:#fff;font-weight:700}
.btn.corn{background:var(--corn);border-color:var(--corn);color:#241803;font-weight:700}
.btn small{color:var(--dim);font-weight:400;margin-left:4px}
.btn.go small,.btn.corn small{color:inherit;opacity:.8}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.bar .btn{flex:1 1 auto}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.inv div{background:var(--tarp-3);border-radius:4px;padding:6px 8px;font-size:12px;color:var(--dim)}
.inv b{display:block;font-size:18px;color:var(--chalk);font-variant-numeric:tabular-nums}
.case h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px;color:var(--clay)}
.meter{display:grid;grid-template-columns:72px 1fr 38px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.track{height:10px;background:var(--tarp-3);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%}
.calm{font-size:13px;color:var(--dim)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px;max-height:220px;overflow:auto}
.log li{border-left:2px solid var(--line);padding-left:8px;color:var(--dim)}
.log li:first-child{color:var(--chalk);border-color:var(--accent)}
.log li .m{font-variant-numeric:tabular-nums;color:var(--dim);margin-right:6px}
details summary{cursor:pointer;font-weight:500}
details p,details li{color:var(--dim);font-size:13px;max-width:68ch}
details ul{padding-left:18px;margin:6px 0}
/* overlay */
.ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px))}
.modal{background:var(--tarp-2);border:1px solid var(--line);border-radius:8px;max-width:640px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.modal p{margin:0;color:var(--dim);max-width:62ch}
.lands{display:grid;gap:8px}
.landc{text-align:left;background:var(--tarp-3);border:2px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.landc.on{border-color:var(--accent)}
.landc strong{font-family:var(--display);font-weight:400;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.row:last-child{border-bottom:0}
.row .ctl{display:flex;gap:4px;align-items:center}
.row .ctl .btn{padding:4px 9px}
.row .n{min-width:3ch;text-align:right}
.cap .track i{background:var(--accent)}
.cap.over .track i{background:var(--clay)}
.map{width:100%;max-width:440px;height:auto;margin:0 auto;display:block}
.map .br{fill:var(--tarp-3);stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
.map text{fill:var(--chalk);font-size:11px;paint-order:stroke;stroke:var(--tarp-2);stroke-width:3px;stroke-linejoin:round}
.map .cand{cursor:pointer;outline:none}
.map .cand:hover circle,.map .cand:focus-visible circle{stroke:var(--accent)}
.map text.c{font-size:11px;font-weight:700}
.map .route{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.cost{font-size:13px;color:var(--dim)}.cost b{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.tabs{display:flex;gap:6px}
.tabs .btn.on{border-color:var(--accent)}
.tbtn{align-self:flex-end;font-size:12px;padding:5px 10px}
.status .tbtn{align-self:center}
@media (prefers-reduced-motion:no-preference){.plot{transition:border-color .15s}.track i{transition:width .3s}}
</style>
</head>

<div class="wrap" id="app"></div>
<div class="ov" id="ov" hidden><div class="modal" id="modal"></div></div>

<script>
/* ============================================================================
   LONA PRETA - the whole game in one file. No build step, no dependencies.
   Read docs/ARCHITECTURE.md first. Search for "=====" to jump between sections:
     1 THEME   2 I18N   3 DATA   4 STATE   5 PLOT ART   6 RENDER
     7 MAP     8 ACTIONS   9 MONTH LOOP   10 MODALS   11 BOOT
   RULES
   - Never write player-visible text inline. Add a key to BOTH languages in
     section 2 and use tr("key",{vars}). See docs/I18N.md.
   - Never hard-code a colour in CSS or JS. Use a CSS variable. See docs/THEMES.md.
   - Run `node scripts/check.mjs` before every commit.
   ============================================================================ */

/* ===== 1. THEME =====
   Two modes, tied to a language ON PURPOSE (this is the author's wish):
     "night"    dark colours                              English
     "bandeira" light colours (flag green/yellow/blue)    Brazilian Portuguese
   Colours live in CSS variables, text lives in I18N. Toggling re-renders both. */
const THEMES={night:{lang:"en",html:"en",meta:"#131415"},bandeira:{lang:"pt",html:"pt-BR",meta:"#f3f6ea"}};
let THEME="night";
const lang=()=>THEMES[THEME].lang;
function initialTheme(){
  try{const q=new URLSearchParams(location.search).get("theme");if(THEMES[q])return q}catch(e){} // ?theme=bandeira, handy for screenshots
  try{const v=localStorage.getItem("lonapreta-theme");if(THEMES[v])return v}catch(e){}
  return window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"bandeira":"night";
}
function applyTheme(name,persist){
  THEME=name;
  const el=document.documentElement;el.dataset.theme=name;el.lang=THEMES[name].html;
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content",THEMES[name].meta);
  if(persist){try{localStorage.setItem("lonapreta-theme",name)}catch(e){}}
}
function toggleTheme(){
  applyTheme(THEME==="night"?"bandeira":"night",true);
  if(!S)return;
  render();
  if(!ov.hidden&&curModal)md.innerHTML=curModal(); // re-translate an open modal in place
}
const themeBtn=()=>`<button class="btn tbtn" data-theme-toggle title="${tr("theme.title")}">${tr("theme.toggle")}</button>`;
applyTheme(initialTheme());

   One dictionary, two languages. EVERY key must exist in both `en` and `pt`
   (node scripts/check.mjs enforces this).
   - Placeholders: {name}. Pass values with tr("key",{name:...}).
   - Plurals: if you call tr("key",{n}) and n===1, the key "key_1" is used when it
     exists. Define "key" (many) and "key_1" (one) in BOTH languages.
   - HTML is allowed only as <b>..</b> and <em>..</em>. No attributes, no quotes.
   - Place names (Fazenda Santa Rita, Pontal do Paranapanema) and crop names
     (Feijão, Milho, Mandioca) are Portuguese in both languages on purpose. */

/* Two idle estates per region, each near one of the region's two real places (jitter of ~0.1 degree, about 10 km). */
function genEstates(){
  const names=[...NAMES].sort(()=>Math.random()-.5);
  return REGIONS.flatMap((r,i)=>REGION_SITES[r].map(([lo,la],k)=>genLand(r,names[i*2+k],lo+rnd(-.1,.1),la+rnd(-.1,.1))));
}
function genLand(region,name,lon,lat){
  const size=pick([9,12,12,16]);
  return {name:"Fazenda "+name,region,lon:+lon.toFixed(2),lat:+lat.toFixed(2),size,cols:size===9?3:4,
    fert:+rnd(.7,1.3).toFixed(2),idle:ri(2,20),owner:ri(15,60),growth:ri(1,4),vigil:+rnd(.5,1.5).toFixed(2),
    well:false,plots:Array.from({length:size},()=>({s:Math.random()<.8?"mato":"terra"}))};
}
/* Labels derived from land numbers. They return TRANSLATED text, so call them at render time. */
const ownerKind=l=>tr(l.owner<30?"owner.heirs":l.owner<45?"owner.absentee":"owner.agro");
const fertLabel=l=>tr(l.fert<.9?"fert.poor":l.fert<1.1?"fert.fair":"fert.rich");
const vigilLabel=l=>tr(l.vigil<.8?"vigil.low":l.vigil<1.15?"vigil.mid":"vigil.high");
const monthOf=t=>tr("month."+((9+t)%12));
const yearOf=t=>2026+Math.floor((9+t)/12);
const rainy=()=>RAINY.has((9+S.t)%12);
const laborMax=()=>S.families*2+S.tools;
const active=()=>S.land?S.land.plots.filter(p=>p.s==="grow"||p.s==="ready").length:0;
function newPrices(){const o={};for(const k in CROPS)o[k]=+(CROPS[k].price*rnd(.8,1.2)).toFixed(2);o.ovos=+rnd(.8,1.2).toFixed(2);return o}

function newGame(){
  S={t:0,families:3,labor:6,money:50,inv:{feijao:20,milho:20,mandioca:12,ovos:0},hens:5,chicks:[],goats:0,tools:0,carts:0,
    land:null,discovered:false,cas:null,acted:{},sel:null,log:[],history:[],landsCount:0,evictions:0,estates:genEstates(),
    phase:"choose",prices:newPrices()};
  moveSel=null; take=null;
  log("log.begin");
}
/* The camp log stores a KEY + vars (not text) so entries re-translate when the player switches mode.
   Old saves may hold {m,when} strings; logText/logWhen fall back to those. */
function log(k,v){S.log.unshift({k,v,at:(S.land||S.t)?S.t:null});S.log=S.log.slice(0,40)}
const logText=l=>{if(!l.k)return l.m;const v={...l.v};if(v.item)v.item=tr("shop."+v.item);return tr(l.k,v)};
const logWhen=l=>!l.k?l.when:l.at==null?tr("log.start"):monthOf(l.at)+" "+yearOf(l.at);
function save(){try{localStorage.setItem("lonapreta",JSON.stringify(S))}catch(e){}}

/* ===== 5. PLOT ART (inline SVG; colours come from --art-* variables, constant in both themes) ===== */
function art(p){
  const soil=`<g stroke="var(--soil-line)" stroke-width="2" fill="none" opacity=".7"><path d="M4 18 Q30 14 56 18"/><path d="M4 30 Q30 26 56 30"/><path d="M4 42 Q30 38 56 42"/><path d="M4 54 Q30 50 56 54"/></g>`;
  if(p.s==="mato") return `<svg viewBox="0 0 60 60"><g stroke="var(--art-leaf-dim)" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M6 56 L9 40 L12 56 M14 56 L18 30 L21 56 M24 56 L27 42 L31 56 M33 56 L37 28 L40 56 M42 56 L45 38 L49 56 M50 56 L53 34 L56 56"/>
    <path d="M10 26 L13 14 L16 26 M30 22 L33 8 L36 22 M44 24 L48 12 L50 24" opacity=".7"/></g></svg>`;
  if(p.s==="terra") return `<svg viewBox="0 0 60 60">${soil}</svg>`;
  const c=CROPS[p.crop], pr=Math.min(1,(p.age+(p.s==="ready"?1:0))/c.grow), h=6+pr*30, xs=[15,30,45];
  let g="";
  for(const x of xs){
    const b=50, top=b-h;
    if(p.crop==="milho"){
      g+=`<path d="M${x} ${b} L${x} ${top}" stroke="var(--art-leaf)" stroke-width="2.4"/>
      <path d="M${x} ${b-h*.4} q-8 -4 -10 2 M${x} ${b-h*.7} q8 -4 10 2" stroke="var(--art-leaf)" stroke-width="2" fill="none"/>`;
      if(p.s==="ready") g+=`<ellipse cx="${x+3}" cy="${b-h*.55}" rx="2.6" ry="6" fill="var(--art-corn)"/>`;
    } else if(p.crop==="feijao"){
      g+=`<path d="M${x} ${b} L${x} ${top}" stroke="var(--art-leaf)" stroke-width="2"/>
      <circle cx="${x-5}" cy="${top+4}" r="${2+pr*3}" fill="var(--art-leaf)"/><circle cx="${x+5}" cy="${top+8}" r="${2+pr*3}" fill="var(--art-leaf)"/>`;
      if(p.s==="ready") g+=`<path d="M${x+2} ${b-8} q4 6 1 10" stroke="#d8c08a" stroke-width="2.4" fill="none"/>`;
    } else {
      g+=`<path d="M${x} ${b} L${x} ${top+4}" stroke="#a0603e" stroke-width="2.2"/>`;
      for(const a of [-50,-25,0,25,50]){const r=(4+pr*8),rad=(a-90)*Math.PI/180;
        g+=`<path d="M${x} ${top+4} L${(x+Math.cos(rad)*r).toFixed(1)} ${(top+4+Math.sin(rad)*r).toFixed(1)}" stroke="var(--art-leaf)" stroke-width="2.4" stroke-linecap="round"/>`;}
      if(p.s==="ready") g+=`<path d="M${x-4} ${b+2} q4 6 8 0" stroke="#c9905e" stroke-width="3" fill="none"/>`;
    }
  }
  return `<svg viewBox="0 0 60 60">${soil}<g fill="none">${g}</g></svg>`;
}
const plotLabel=p=>p.s==="mato"?tr("plot.scrub"):p.s==="terra"?tr("plot.cleared"):p.s==="ready"?tr("plot.harvest"):CROPS[p.crop].name+" "+p.age+"/"+CROPS[p.crop].grow;

/* ===== 6. RENDER (main screen; rebuilds #app from S every time) ===== */
function render(){
  const L=S.land, app=document.getElementById("app");
  const title=`<h1>Lona <span>Preta</span></h1>`;
  if(!L){app.innerHTML=`<header class="top"><div>${title}</div><div class="status">${themeBtn()}</div></header>`;return}
  const p=S.sel!=null?L.plots[S.sel]:null;
  let acts="";
  if(!p) acts=`<span class="calm">${tr("act.tap")}</span>`;
  else if(p.s==="mato") acts=`<button class="btn" data-a="clear" ${S.labor<1?"disabled":""}>${tr("act.clear")}<small>${tr("act.laborCost")}</small></button>`;
  else if(p.s==="terra") acts=Object.keys(CROPS).map(k=>`<button class="btn" data-a="plant" data-c="${k}" ${S.labor<1||S.inv[k]<SEED_COST?"disabled":""}>${tr("act.plant",{crop:CROPS[k].name})}<small>${tr("act.plantCost",{grow:CROPS[k].grow,seed:SEED_COST})}</small></button>`).join("");
  else if(p.s==="ready") acts=`<button class="btn corn" data-a="harvest" ${S.labor<1?"disabled":""}>${tr("act.harvest",{crop:CROPS[p.crop].name})}<small>${tr("act.laborCost")}</small></button>`;
  else acts=`<span class="calm">${tr("act.growing",{crop:CROPS[p.crop].name,n:CROPS[p.crop].grow-p.age})}${p.f<1?tr("act.dryHalf"):""}</span>`;

  const C=S.cas;
  const caseHtml=C?`<div class="panel case"><div class="landhead"><h3>${tr("case.title")}</h3><span class="label">${tr("case.hearing",{n:C.months})}</span></div>
    <div class="meter"><span>${tr("case.defense")}</span><div class="track"><i style="width:${Math.min(100,C.defense/Math.max(C.defense,C.owner,1)*100)}%;background:var(--leaf)"></i></div><b>${Math.round(C.defense)}</b></div>
    <div class="meter"><span>${tr("case.owner")}</span><div class="track"><i style="width:${Math.min(100,C.owner/Math.max(C.defense,C.owner,1)*100)}%;background:var(--clay)"></i></div><b>${Math.round(C.owner)}</b></div>
    <span class="calm">${tr("case.note",{n:defenseTick()})}</span>
    <div class="actions">
      <button class="btn" data-a="lawyer" ${S.acted.lawyer||S.money<30?"disabled":""}>${tr("case.lawyer")}<small>${tr("case.lawyerCost")}</small></button>
      <button class="btn" data-a="laudo" ${C.laudo||S.money<60?"disabled":""}>${tr("case.laudo")}<small>${tr("case.laudoCost",{n:L.idle*2})}</small></button>
      <button class="btn" data-a="mob" ${S.acted.mob||S.labor<3?"disabled":""}>${tr("case.mob")}<small>${tr("case.mobCost")}</small></button>
    </div></div>`
    :`<div class="panel case"><div class="landhead"><h3 style="color:var(--leaf)">${tr("case.quiet")}</h3><span class="label">${S.discovered?"":tr("case.undiscovered")}</span></div>
      <span class="calm">${tr("case.quietNote",{vigil:vigilLabel(L)})}</span></div>`;

  const sel=moveSel!=null?S.estates[moveSel]:null;
  const moveBlock=S.phase==="won"?"":sel
    ?`${estateCard(sel)}<div class="bar"><button class="btn go" data-a="move" ${S.money<moveCost(sel)?"disabled":""}>${tr("map.moveHere")}<small>R$${moveCost(sel)}</small></button></div>`
    :`<span class="calm">${tr("map.hint")}</span>`;

  app.innerHTML=`
  <header class="top">
    <div>${title}<div class="tag">${tr("app.tagline")}</div></div>
    <div class="status">
      <span class="chip ${rainy()?"rain":"dry"}">${monthOf(S.t)} ${yearOf(S.t)} <b>${rainy()?tr("stat.rain"):tr("stat.dry")}</b></span>
      <span class="chip">${tr("stat.families")} <b>${S.families}</b></span>
      <span class="chip">${tr("stat.labor")} <b>${S.labor}/${laborMax()}</b></span>
      <span class="chip">R$ <b>${S.money.toFixed(0)}</b></span>
      ${themeBtn()}
    </div>
  </header>
  <div class="cols">
    <div class="panel">
      <div class="landhead"><h2>${L.name}</h2><span class="label">${L.region}</span></div>
      <div class="facts"><span>${tr("land.yrsUnused",{n:L.idle})}</span><span><b>${fertLabel(L)}</b></span><span>${tr("land.owner",{kind:ownerKind(L)})}</span>${L.well?`<span><b>${tr("land.well")}</b></span>`:""}</div>
      <div class="grid" style="grid-template-columns:repeat(${L.cols},minmax(0,1fr))">
        ${L.plots.map((q,i)=>`<button class="plot ${S.sel===i?"sel":""} ${q.s}" data-p="${i}" aria-label="${tr("plot.aria",{i:i+1,label:plotLabel(q)})}">${art(q)}<span class="badge">${plotLabel(q)}</span></button>`).join("")}
      </div>
      <div class="actions">${acts}</div>
      <div class="bar">
        <button class="btn" data-a="market">${tr("act.market")}</button>
        <button class="btn" data-a="move">${tr("act.move")}</button>
        <button class="btn go" data-a="next">${tr("act.next")}</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      ${caseHtml}
      <div class="panel"><div class="landhead"><span class="label">${tr("map.title")}</span><span class="label">${S.phase==="won"?tr("map.won"):tr("map.inProd",{a:active(),b:L.size})}</span></div>${mapHtml()}
        ${moveBlock}</div>
      <div class="panel"><span class="label">${tr("store.title")}</span>
        <div class="inv">
          ${Object.keys(CROPS).map(k=>`<div><b>${S.inv[k]}</b>${CROPS[k].name}<span>${tr("crop."+k+".gloss")}</span></div>`).join("")}
          <div><b>${S.inv.ovos}</b>${tr("store.eggs")}</div>
          <div><b>${S.hens}</b>${tr("store.hens")}${S.chicks.length?tr("store.chicks",{n:S.chicks.length}):""}</div>
          ${S.goats?`<div><b>${S.goats}</b>${tr("store.goats")}</div>`:""}
          ${S.tools?`<div><b>${S.tools}</b>${tr("store.hoes")}</div>`:""}
          ${S.carts?`<div><b>${S.carts}</b>${tr("store.carts")}</div>`:""}
        </div>
        <span class="calm">${tr("store.eat",{n:S.families*2})}</span>
      </div>
      <div class="panel"><span class="label">${tr("log.title")}</span>
        <ul class="log">${S.log.slice(0,14).map(l=>`<li><span class="m">${logWhen(l)}</span>${logText(l)}</li>`).join("")}</ul>
      </div>
      <details class="panel"><summary>${tr("howto.title")}</summary>
        <ul>${[1,2,3,4,5,6].map(i=>`<li>${tr("howto."+i)}</li>`).join("")}</ul>
      </details>
    </div>
  </div>`;
}

/* ===== 7. MAP =====
   One SVG of Brazil. Draw order: evicted crosses, route line, idle estates (selected one last), your camp. */
const ll=l=>{const r=REGION_XY[l.region]||[-52,-15];return [l.lon??r[0],l.lat??r[1]]};
const pos=l=>geo(...ll(l));
/* Moving costs trucks and fuel: R$10 base + R$0.03 per km. Road distance is ~1.3x the straight line. */
function kmTo(l){
  const [a,b]=[ll(S.land),ll(l)].map(([lo,la])=>[lo*Math.PI/180,la*Math.PI/180]);
  const h=Math.sin((b[1]-a[1])/2)**2+Math.cos(a[1])*Math.cos(b[1])*Math.sin((b[0]-a[0])/2)**2;
  return Math.round(2*6371*Math.asin(Math.sqrt(h))*1.3/10)*10;
}
const moveCost=l=>S.land?Math.round(10+kmTo(l)*.03):0;
const CIRC=2*Math.PI*7;
const estateTip=l=>S.land?tr("map.tipCost",{name:l.name,idle:l.idle,size:l.size,km:kmTo(l),c:moveCost(l)}):tr("map.tip",{name:l.name,idle:l.idle,size:l.size});
function mapHtml(){
  let m="";
  for(const h of S.history){if(!h.evicted)continue;const [x,y]=pos(h);
    m+=`<path d="M${x-3} ${y-3}L${x+3} ${y+3}M${x+3} ${y-3}L${x-3} ${y+3}" stroke="var(--clay)" stroke-width="2" stroke-linecap="round"><title>${tr("map.tipEvicted",{name:h.name})}</title></path>`}
  const sel=moveSel!=null?S.estates[moveSel]:null;
  if(S.land&&sel){const [x1,y1]=pos(S.land),[x2,y2]=pos(sel);m+=`<line class="route" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}
  [...S.estates.keys()].sort((a,b)=>(a===moveSel)-(b===moveSel)).forEach(i=>{
    const l=S.estates[i],[x,y]=pos(l),r=5+l.size/5,on=moveSel===i,c=moveCost(l),tip=estateTip(l);
    m+=`<g data-land="${i}" class="cand${on?" on":""}" tabindex="0" role="button" aria-label="${tip}"><title>${tip}</title>
      <circle cx="${x}" cy="${y}" r="${r}" fill="var(--clay)" fill-opacity="${S.land&&S.money<c&&S.phase!=="evict"?.3:.85}" stroke="${on?"var(--accent)":"var(--chalk)"}" stroke-width="${on?3:1}"/>
      ${on?`<text class="c" x="${x}" y="${y+r+11}" text-anchor="middle">${l.name.replace("Fazenda ","")}${S.land?` · R$${c}`:""}</text>`:""}</g>`});
  if(S.land){
    const L=S.land,[x,y]=pos(L),won=S.phase==="won",frac=won?1:active()/L.size;
    m+=`<g><title>${tr("map.tipCamp",{name:L.name,a:active(),b:L.size})}</title>
      <circle cx="${x}" cy="${y}" r="14" fill="var(--clay)"/>
      <circle cx="${x}" cy="${y}" r="7" fill="none" stroke="var(--leaf)" stroke-width="14" stroke-dasharray="${(frac*CIRC).toFixed(2)} ${CIRC.toFixed(2)}" transform="rotate(-90 ${x} ${y})"/>
      <circle cx="${x}" cy="${y}" r="14" fill="none" stroke="${won?"var(--corn)":"var(--chalk)"}" stroke-width="${won?3:1.5}"/>
      <text x="${x}" y="${y-19}" text-anchor="middle">${won?tr("map.settlement"):tr("map.you")}</text></g>`;
  }
  return `<svg class="map" viewBox="0 0 400 395" role="img" aria-label="${tr("map.aria")}"><path d="${BR_PATH}" class="br"/>${m}</svg>
    <div class="legend"><span><i style="background:var(--clay)"></i>${tr("map.legendIdle")}</span>${S.land&&S.phase!=="evict"?`<span><i style="background:var(--clay);opacity:.3"></i>${tr("map.legendCostly")}</span>`:""}<span><i style="background:var(--leaf)"></i>${tr("map.legendProd")}</span><span><b style="color:var(--clay)">✕</b> ${tr("map.legendEvicted")}</span></div>`;
}
/* Details (and move cost) of an estate selected on the map. */
const estateCard=l=>`<div class="landc on"><strong>${l.name}</strong>
  <span class="calm">${S.land?tr("estate.far",{region:l.region,km:kmTo(l)}):l.region}</span>
  <span class="facts"><span>${tr("land.yrsUnused",{n:l.idle})}</span><span><b>${fertLabel(l)}</b></span><span>${tr("land.plots",{n:l.size})}</span><span>${ownerKind(l)}</span><span>${vigilLabel(l)}</span></span>
  ${S.land?`<span class="cost">${tr("estate.cost",{c:moveCost(l)})}</span>`:""}</div>`;
const defenseTick=()=>Math.round(active()*.6+S.families*.5);

/* ===== 8. ACTIONS (clicks and keys) ===== */
document.addEventListener("click",e=>{
  if(e.target.closest("[data-theme-toggle]")){toggleTheme();return}
  const lb=e.target.closest("[data-land]"); if(lb&&!lb.closest("#ov")){moveSel=moveSel===+lb.dataset.land?null:+lb.dataset.land;render();return}
  const pb=e.target.closest("[data-p]"); if(pb){S.sel=+pb.dataset.p;render();return}
  const b=e.target.closest("[data-a]"); if(!b||b.disabled)return;
  const a=b.dataset.a, L=S.land, p=S.sel!=null&&L?L.plots[S.sel]:null;
  switch(a){
    case "clear": p.s="terra";S.labor--;break;
    case "plant":{const c=b.dataset.c;S.inv[c]-=SEED_COST;S.labor--;Object.assign(p,{s:"grow",crop:c,age:0,f:(rainy()||L.well)?1:.5});break}
    case "harvest":{const n=Math.round(CROPS[p.crop].yield*L.fert*p.f);S.inv[p.crop]+=n;log("log.harvest",{n,crop:CROPS[p.crop].name});p.s="terra";delete p.crop;S.labor--;break}
    case "lawyer": S.money-=30;S.cas.defense+=6;S.acted.lawyer=1;log("log.lawyer");break;
    case "laudo": S.money-=60;S.cas.defense+=L.idle*2;S.cas.laudo=1;log("log.laudo",{n:L.idle});break;
    case "mob": S.labor-=3;S.cas.defense+=5;S.acted.mob=1;log("log.mob");break;
    case "market": marketTab="sell";openMarket();return;
    case "move": take=null;openMove(false);return;
    case "next": endMonth();break;
  }
  save();render();
});
document.addEventListener("keydown",e=>{ // make SVG map markers keyboard-operable
  if((e.key==="Enter"||e.key===" ")&&e.target.matches?.("[data-land]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});

/* ===== 9. MONTH LOOP (food, chickens, events, court case) =====
   endMonth(travel): travel=true when called from doMove (no farming/legal/event that month). */
function eat(milk){
  let need=S.families*2;
  const use=n=>{const u=Math.min(n,need);need-=u;return u};
  use(milk);
  for(const k of ["ovos","mandioca","milho","feijao"]) S.inv[k]-=use(S.inv[k]);
  if(need>0){S.families--;log("log.hunger");}
}
function chickens(){
  if(S.hens>0){
    const corn=Math.ceil(S.hens/3), fed=S.inv.milho>=corn;
    if(fed)S.inv.milho-=corn;
    S.inv.ovos+=S.hens*(fed?3:1);
  }
  S.chicks=S.chicks.map(a=>a+1);
  const grown=S.chicks.filter(a=>a>=2).length; S.chicks=S.chicks.filter(a=>a<2); S.hens+=grown;
  if(S.hens>=2){const n=ri(0,Math.ceil(S.hens/4));for(let i=0;i<n;i++){S.chicks.push(0);S.inv.ovos=Math.max(0,S.inv.ovos-1)}}
}
/* Each event changes the state and returns [logKey, vars] (or nothing when it does not apply). */
const EVENTS=[
  ()=>{if(!S.hens)return;const n=ri(1,Math.ceil(S.hens/3));S.hens-=n;return ["ev.fox",{n}]},
  ()=>{if(!active())return;S.land.plots.forEach(p=>{if(p.s==="grow")p.age=Math.min(p.age+1,CROPS[p.crop].grow-1)});return ["ev.rain"]},
  ()=>{if(!active())return;S.land.plots.forEach(p=>{if(p.s==="grow")p.f*=.8});return ["ev.drySpell"]},
  ()=>{const n=ri(20,60);S.money+=n;return ["ev.union",{n}]},
  ()=>{for(const k in S.prices)S.prices[k]=+(S.prices[k]*1.5).toFixed(2);return ["ev.fair"]},
  ()=>{if(S.cas){S.cas.defense+=6;return ["ev.press"]}},
  ()=>{S.inv.feijao+=5;S.inv.milho+=5;return ["ev.seeds"]},
  ()=>{if(S.families>=8)return;S.families++;return ["ev.family"]},
  ()=>{S.land.fert=+(S.land.fert+.05).toFixed(2);return ["ev.soil"]}
];
function endMonth(travel){
  if(!travel) S.land.plots.forEach(p=>{if(p.s==="grow"){p.age++;if(p.age>=CROPS[p.crop].grow)p.s="ready"}});
  chickens();
  eat(S.goats*3);
  if(S.families<=0){S.phase="lost";S.t++;save();render();openEnd();return}
  const food=S.inv.ovos+S.inv.mandioca+S.inv.milho+S.inv.feijao;
  if(!travel&&food>=S.families*10&&S.families<8&&Math.random()<.3){S.families++;log("log.eatsWell")}
  if(!travel) legal();
  if(S.phase!=="play"){S.t++;S.labor=laborMax();save();render();return}
  if(!travel&&Math.random()<.3){const ev=pick(EVENTS)();if(ev)log(...ev)}
  S.t++; S.acted={}; S.labor=laborMax(); S.prices=newPrices();
}
function legal(){
  const L=S.land;
  if(!S.discovered){
    const pr=.03+.015*active()*L.vigil+(S.hens>12?.02:0);
    if(Math.random()<pr){
      S.discovered=true;
      S.cas={owner:L.owner+ri(0,8),defense:Math.round(L.idle*1.5),months:6,laudo:0};
      log("log.discovered");
      showInfo("info.ownerTitle","info.ownerBody",()=>({kind:ownerKind(L)}));
    }
    return;
  }
  const C=S.cas;
  C.defense+=defenseTick(); C.owner+=L.growth; C.months--;
  if(C.months<=0){
    if(C.defense>=C.owner){S.phase="won";log("log.won",{name:L.name});openEnd()}
    else{S.phase="evict";S.evictions++;log("log.evicted",{name:L.name});moveSel=null;take=null;openMove(true)}
  }
}

/* ===== 10. MODALS =====
   show(fn) takes a FUNCTION that returns the modal HTML, so toggleTheme() can rebuild it in the other language.
   Read state inside fn (not before it), otherwise a re-render would show stale numbers. */
const ov=document.getElementById("ov"), md=document.getElementById("modal");
function show(fn){curModal=fn;md.innerHTML=fn();ov.hidden=false}
function hide(){curModal=null;ov.hidden=true;render()}
function showInfo(titleKey,bodyKey,varsFn){setTimeout(()=>show(()=>`${themeBtn()}<h2>${tr(titleKey)}</h2><p>${tr(bodyKey,varsFn?varsFn():{})}</p><div class="bar"><button class="btn go" id="okb">${tr("info.ok")}</button></div>`),0)}
md.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-land]"); if(!b||b.disabled)return;
  if(b.id==="okb"){hide();return}
  const d=b.dataset;
  if(d.close){hide();return}
  if(d.tab){marketTab=d.tab;openMarket();return}
  if(d.sell){const k=d.sell,n=Math.min(+d.n,S.inv[k]);S.inv[k]-=n;S.money+=n*S.prices[k];save();openMarket();return}
  if(d.buy){buy(d.buy);save();openMarket();return}
  if(d.land!=null){moveSel=+d.land;if(S.phase!=="choose"&&!take)take=defaultTake();(S.phase==="choose"?openChoose:()=>openMove(S.phase==="evict"))();return}
  if(d.tk){const [k,dl]=[d.tk,+d.dl];take[k]=Math.max(0,Math.min(have(k),take[k]+dl));openMove(S.phase==="evict");return}
  if(d.settle){settle();return}
  if(d.go){doMove();return}
  if(d.restart){newGame();render();openChoose();return}
});
ov.addEventListener("click",e=>{if(e.target===ov&&S.phase==="play")hide()});

/* Shop: label = tr("shop."+k), optional note = tr("shop."+k+".note"). */
const SHOP=[
  {k:"feijao",cost:()=>Math.ceil(S.prices.feijao*1.5*5),do:()=>S.inv.feijao+=5},
  {k:"milho",cost:()=>Math.ceil(S.prices.milho*1.5*5),do:()=>S.inv.milho+=5},
  {k:"mandioca",cost:()=>Math.ceil(S.prices.mandioca*1.5*5),do:()=>S.inv.mandioca+=5},
  {k:"hen",cost:()=>15,do:()=>S.hens++},
  {k:"goat",cost:()=>60,do:()=>S.goats++},
  {k:"hoe",cost:()=>30,do:()=>S.tools++},
  {k:"cart",cost:()=>120,do:()=>S.carts++},
  {k:"well",cost:()=>80,do:()=>S.land.well=true,once:()=>S.land.well}
];
function buy(k){const it=SHOP.find(x=>x.k===k);const c=it.cost();if(S.money>=c){S.money-=c;it.do();log("log.bought",{item:k})}}
function openMarket(){show(()=>{
  const sell=["feijao","milho","mandioca","ovos"].map(k=>{const nm=k==="ovos"?tr("store.eggs"):CROPS[k].name;
    return `<div class="row"><span>${nm} <span class="calm">· ${S.inv[k]} · R$${S.prices[k].toFixed(2)}</span></span><span class="ctl">
    <button class="btn" data-sell="${k}" data-n="1" ${S.inv[k]<1?"disabled":""}>${tr("market.sell1")}</button>
    <button class="btn" data-sell="${k}" data-n="10" ${S.inv[k]<1?"disabled":""}>${tr("market.sell10")}</button></span></div>`}).join("");
  const buyH=SHOP.map(it=>{const done=it.once&&it.once(),nk="shop."+it.k+".note";return `<div class="row"><span>${tr("shop."+it.k)}${hasKey(nk)?` <span class="calm">· ${tr(nk)}</span>`:""}</span><span class="ctl">
    <button class="btn" data-buy="${it.k}" ${done||S.money<it.cost()?"disabled":""}>${done?tr("market.done"):"R$"+it.cost()}</button></span></div>`}).join("");
  return `${themeBtn()}<div class="landhead"><h2>${tr("market.title")}</h2><span class="chip">R$ <b>${S.money.toFixed(2)}</b></span></div>
  <p>${tr("market.note",{n:S.families*2})}</p>
  <div class="tabs"><button class="btn ${marketTab==="sell"?"on":""}" data-tab="sell">${tr("market.sell")}</button><button class="btn ${marketTab==="buy"?"on":""}" data-tab="buy">${tr("market.buy")}</button></div>
  <div>${marketTab==="sell"?sell:buyH}</div>
  <div class="bar"><button class="btn go" data-close="1">${tr("market.back")}</button></div>`})}

const pickHint=()=>`<span class="calm">${tr("choose.hint")}</span>`;
function openChoose(){show(()=>`${themeBtn()}<h2>${tr("choose.title")}</h2>
  <p>${tr("choose.text")}</p>
  ${mapHtml()}
  ${moveSel!=null?estateCard(S.estates[moveSel]):pickHint()}
  <div class="bar"><button class="btn go" data-settle="1" ${moveSel==null?"disabled":""}>${tr("choose.go")}</button></div>`)}
function settle(){
  S.land=S.estates.splice(moveSel,1)[0];moveSel=null;S.landsCount=1;S.phase="play";S.labor=laborMax();
  log("log.settle",{name:S.land.name,region:S.land.region});hide();save();
}
const cap=()=>S.families*15+S.carts*60;
const have=k=>k==="hens"?S.hens:k==="chicks"?S.chicks.length:k==="tools"?S.tools:S.inv[k];
const W={feijao:1,milho:1,mandioca:1,ovos:1,hens:1,chicks:1,tools:2};   // weight of one unit when packing
const TAKEK=[["hens",()=>tr("store.hens")],["chicks",()=>tr("take.chicks")],["milho",()=>CROPS.milho.name],["feijao",()=>CROPS.feijao.name],["mandioca",()=>CROPS.mandioca.name],["ovos",()=>tr("store.eggs")],["tools",()=>tr("store.hoes")]];
const weight=t=>Object.keys(W).reduce((s,k)=>s+t[k]*W[k],0);
function defaultTake(){const t={};let room=cap();for(const [k] of TAKEK){const n=Math.max(0,Math.min(have(k),Math.floor(room/W[k])));t[k]=n;room-=n*W[k]}return t}
function openMove(forced){show(()=>{
  if(!take)take=defaultTake();
  const w=weight(take),c=cap(),over=w>c;
  const dest=moveSel!=null?S.estates[moveSel]:null, cost=dest?moveCost(dest):0, broke=!forced&&dest&&S.money<cost;
  const left=S.land.plots.filter(p=>p.s==="grow"||p.s==="ready").length;
  const goLabel=over?tr("move.tooHeavy"):broke?tr("move.need",{n:cost}):dest?tr("move.goCost",{n:forced?Math.min(S.money,cost):cost}):tr("move.go");
  return `${themeBtn()}<h2>${forced?tr("move.titleForced"):tr("move.title")}</h2>
  <p>${forced?tr("move.forced",{name:S.land.name}):tr("move.voluntary")} ${tr(S.land.well?"move.stayWell":"move.stay")}${left?" "+tr("move.lost",{n:left}):""} ${tr(forced?"move.goatsUnion":"move.goats")}</p>
  <span class="label">${tr("move.choose")}</span>
  ${mapHtml()}
  ${moveSel!=null?estateCard(S.estates[moveSel]):pickHint()}
  <span class="label">${tr("move.pack")}</span>
  <div class="meter cap ${over?"over":""}" style="grid-template-columns:90px 1fr 70px"><span>${tr("move.load")}</span><div class="track"><i style="width:${Math.min(100,w/c*100)}%"></i></div><b>${w}/${c}</b></div>
  <div>${TAKEK.filter(([k])=>have(k)>0).map(([k,nm])=>{const step=W[k]===1&&have(k)>10?5:1;return `<div class="row"><span>${nm()} <span class="calm">· ${tr("move.have",{n:have(k)})}</span></span><span class="ctl">
    <button class="btn" data-tk="${k}" data-dl="-${step}">−${step}</button><span class="n">${take[k]}</span><button class="btn" data-tk="${k}" data-dl="${step}">+${step}</button></span></div>`}).join("")}</div>
  <span class="calm">${tr(S.carts?"move.capacityCart":"move.capacity")}</span>
  <div class="bar">${forced?"":`<button class="btn" data-close="1">${tr("move.stayBtn")}</button>`}<button class="btn go" data-go="1" ${moveSel==null||over||broke?"disabled":""}>${goLabel}</button></div>`})}
function doMove(){
  const dest=S.estates[moveSel], forced=S.phase==="evict", cost=moveCost(dest), paid=forced?Math.min(S.money,cost):cost, km=kmTo(dest);
  if(!forced&&S.money<cost)return;
  S.money-=paid;
  S.estates.splice(moveSel,1);
  if(!forced)S.estates.push({...S.land,plots:S.land.plots.map(()=>({s:"mato"}))}); // left voluntarily: the land reverts to scrub, still idle
  S.inv={feijao:take.feijao,milho:take.milho,mandioca:take.mandioca,ovos:take.ovos};
  S.hens=take.hens;S.chicks=S.chicks.slice(0,take.chicks);S.tools=take.tools;
  const from=S.land.name;
  S.history.push({name:from,region:S.land.region,lon:S.land.lon,lat:S.land.lat,evicted:forced});
  S.land=dest;S.discovered=false;S.cas=null;S.sel=null;S.landsCount++;S.phase="play";
  log("log.moved",{from,km,name:dest.name,region:dest.region,paid});
  endMonth(true);
  moveSel=null;take=null;
  if(S.phase==="play"){hide();save()}
}
function openEnd(){setTimeout(()=>show(()=>{
  const won=S.phase==="won";
  return `${themeBtn()}<h2>${won?tr("end.wonTitle",{name:S.land.name}):tr("end.lostTitle")}</h2>
  <p>${won?tr("end.won",{fam:S.families,t:S.t,occ:tr("end.occ",{n:S.landsCount})}):tr("end.lost",{t:S.t})}</p>
  <div class="inv"><div><b>${S.t}</b>${tr("end.months")}</div><div><b>${S.landsCount}</b>${tr("end.estates")}</div><div><b>${S.evictions}</b>${tr("end.evictions")}</div><div><b>${S.families}</b>${tr("end.families")}</div><div><b>${S.hens}</b>${tr("end.hens")}</div><div><b>${S.goats}</b>${tr("end.goats")}</div></div>
  <div class="bar"><button class="btn go" data-restart="1">${tr("end.restart")}</button></div>`}),0)}

/* ===== 11. BOOT ===== */
function start(data){
  S=data&&data.S;
  if(!S){try{S=JSON.parse(localStorage.getItem("lonapreta"))}catch(e){S=null}}
  if(!S||!S.inv){newGame()}
  S.history=S.history||[];            // saves from before the map existed
  S.estates=S.estates||genEstates();  // saves from before selectable estates existed
  render();
  if(S.phase==="choose")openChoose();
  else if(S.phase==="evict")openMove(true);
  else if(S.phase==="won"||S.phase==="lost")openEnd();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
