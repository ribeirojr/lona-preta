<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lona Preta</title>
<meta name="theme-color" content="#131415">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;700&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
/* Layout: a camp ledger under black tarp: status strip, the land as a soil grid, and a side column of stores, court case, map and log.
   THEMES (see docs/THEMES.md): ":root" is NIGHT (dark, English). ':root[data-theme="bandeira"]' is MODO BANDEIRA (light, flag colours, Portuguese).
   Every colour variable defined in :root must be redefined in the bandeira block unless it is in the "constant" group. scripts/check.mjs enforces this. */
:root{
  /* surfaces and text */
  --tarp:#131415; --tarp-2:#1c1e1f; --tarp-3:#26292a; --line:#363a3b;
  --chalk:#efe7d3; --dim:#a69d89;
  /* semantic colours */
  --clay:#c24a2f;      /* idle land, danger, owner's case */
  --corn:#e9b62c;      /* flag-yellow highlight: harvest button, ready badge */
  --leaf:#77a94b;      /* productive land, your defense */
  --accent:#e9b62c;    /* selection, focus ring, route line, cost numbers */
  --go:#c24a2f;        /* primary button background */
  --brand:#c24a2f;     /* the word "Preta" in the title */
  --scrim:rgba(5,5,5,.78);      /* modal backdrop */
  --pattern:rgba(255,255,255,.012);
  /* constant in both themes: the plots are drawn on brown earth, so their art never changes */
  --soil:#4a2c1d; --soil-2:#5f3a26; --soil-line:#7a4d33;
  --art-leaf:#77a94b; --art-leaf-dim:#4f7434; --art-corn:#e9b62c; --on-dark:#efe7d3;
  --display:"Alfa Slab One", "Rockwell", "Roboto Slab", Georgia, serif;
  --body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
:root[data-theme="bandeira"]{
  --tarp:#f3f6ea; --tarp-2:#ffffff; --tarp-3:#e7efd9; --line:#c3d1ae;
  --chalk:#0d2240; --dim:#4a5a6b;
  --clay:#c8452a; --corn:#fedd00; --leaf:#08873a;
  --accent:#002776; --go:#002776; --brand:#009b3a;
  --scrim:rgba(13,34,64,.55);
  --pattern:rgba(0,39,118,.035);
  color-scheme:light;
}
/* Flag stripe across the top in Modo Bandeira: green, yellow, blue */
:root[data-theme="bandeira"] body::before{content:"";position:fixed;inset:0 0 auto 0;height:6px;z-index:40;
  background:linear-gradient(90deg,#009b3a 0 33.4%,#fedd00 33.4% 66.7%,#002776 66.7%)}
html,body{height:100%}
body{background:var(--tarp);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 28px;
  background-image:repeating-linear-gradient(115deg, transparent 0 22px, var(--pattern) 22px 23px);}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);line-height:1;margin:0;letter-spacing:.01em}
h1 span{color:var(--brand)}
.tag{color:var(--dim);font-size:13px;max-width:52ch}
.status{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--tarp-2);border:1px solid var(--line);border-radius:4px;padding:5px 9px;font-size:13px;display:flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums}
.chip b{font-size:15px}
.chip.rain{border-color:#3d6a7a}.chip.dry{border-color:#8a6a2a}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--tarp-2);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.landhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.landhead h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--dim)}
.facts b{color:var(--chalk);font-weight:500}
.grid{display:grid;gap:6px}
.plot{aspect-ratio:1;max-width:100%;border-radius:4px;border:2px solid transparent;padding:0;position:relative;
  background:linear-gradient(160deg,var(--soil-2),var(--soil));overflow:hidden}
.plot svg{width:100%;height:100%;display:block}
.plot.sel{border-color:var(--accent)}
.plot .badge{position:absolute;left:4px;bottom:3px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.55);color:var(--on-dark);padding:1px 5px;border-radius:3px}
.plot.ready .badge{background:var(--corn);color:#2a1d05;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;align-items:center}
.btn{background:var(--tarp-3);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:14px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--dim)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{background:var(--go);border-color:var(--go);color:#fff;font-weight:700}
.btn.corn{background:var(--corn);border-color:var(--corn);color:#241803;font-weight:700}
.btn small{color:var(--dim);font-weight:400;margin-left:4px}
.btn.go small,.btn.corn small{color:inherit;opacity:.8}
.bar{display:flex;flex-wrap:wrap;gap:8px}
.bar .btn{flex:1 1 auto}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.inv div{background:var(--tarp-3);border-radius:4px;padding:6px 8px;font-size:12px;color:var(--dim)}
.inv b{display:block;font-size:18px;color:var(--chalk);font-variant-numeric:tabular-nums}
.case h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px;color:var(--clay)}
.meter{display:grid;grid-template-columns:72px 1fr 38px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.track{height:10px;background:var(--tarp-3);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%}
.calm{font-size:13px;color:var(--dim)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px;max-height:220px;overflow:auto}
.log li{border-left:2px solid var(--line);padding-left:8px;color:var(--dim)}
.log li:first-child{color:var(--chalk);border-color:var(--accent)}
.log li b{color:var(--chalk);font-weight:500}
.log li .m{font-variant-numeric:tabular-nums;color:var(--dim);margin-right:6px}
details summary{cursor:pointer;font-weight:500}
details p,details li{color:var(--dim);font-size:13px;max-width:68ch}
details ul{padding-left:18px;margin:6px 0}
/* overlay */
.ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px))}
.modal{background:var(--tarp-2);border:1px solid var(--line);border-radius:8px;max-width:640px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.modal p{margin:0;color:var(--dim);max-width:62ch}
.lands{display:grid;gap:8px}
.landc{text-align:left;background:var(--tarp-3);border:2px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.landc.on{border-color:var(--accent)}
.landc.won{border-color:var(--leaf)}
.landc.lost{border-color:var(--clay)}
.landc strong{font-family:var(--display);font-weight:400;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.row:last-child{border-bottom:0}
.row .ctl{display:flex;gap:4px;align-items:center}
.row .ctl .btn{padding:4px 9px}
.row .n{min-width:3ch;text-align:right}
.map{width:100%;max-width:440px;height:auto;margin:0 auto;display:block}
.map .br{fill:var(--tarp-3);stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
.map text{fill:var(--chalk);font-size:11px;paint-order:stroke;stroke:var(--tarp-2);stroke-width:3px;stroke-linejoin:round}
.map .cand{cursor:pointer;outline:none}
.map .cand:hover circle,.map .cand:focus-visible circle{stroke:var(--accent)}
.map text.c{font-size:11px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.camps{display:flex;flex-wrap:wrap;gap:6px}
.camps .btn{flex:1 1 130px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:7px 11px}
.camps .btn .n{font-family:var(--display);font-size:15px;font-weight:400}
.camps .btn small{margin:0;font-size:12px}
.camps .btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.camps .btn.hearing small,.camps .btn.lost small{color:var(--clay)}
.camps .btn.won small{color:var(--leaf)}
.camps .btn.lost .n{text-decoration:line-through}
.tabs{display:flex;gap:6px}
.tabs .btn.on{border-color:var(--accent)}
.tbtn{align-self:flex-end;font-size:12px;padding:5px 10px}
.status .tbtn{align-self:center}
@media (prefers-reduced-motion:no-preference){.plot{transition:border-color .15s}.track i{transition:width .3s}}
</style>
</head>

<div class="wrap" id="app"></div>
<div class="ov" id="ov" hidden><div class="modal" id="modal"></div></div>

<script>
/* ============================================================================
   LONA PRETA - the whole game in one file. No build step, no dependencies.
   Read docs/ARCHITECTURE.md first. Search for "=====" to jump between sections:
     1 THEME   2 I18N   3 DATA   4 STATE   5 PLOT ART   6 RENDER
     7 MAP     8 ACTIONS   9 MONTH LOOP   10 MODALS   11 BOOT
   RULES
   - Never write player-visible text inline. Add a key to BOTH languages in
     section 2 and use tr("key",{vars}). See docs/I18N.md.
   - Never hard-code a colour in CSS or JS. Use a CSS variable. See docs/THEMES.md.
   - Run `node scripts/check.mjs` before every commit.
   ============================================================================ */

/* ===== 1. THEME =====
   Two modes, tied to a language ON PURPOSE (this is the author's wish):
     "night"    dark colours                              English
     "bandeira" light colours (flag green/yellow/blue)    Brazilian Portuguese
   Colours live in CSS variables, text lives in I18N. Toggling re-renders both. */
const THEMES={night:{lang:"en",html:"en",meta:"#131415"},bandeira:{lang:"pt",html:"pt-BR",meta:"#f3f6ea"}};
let THEME="night";
const lang=()=>THEMES[THEME].lang;
function initialTheme(){
  try{const q=new URLSearchParams(location.search).get("theme");if(THEMES[q])return q}catch(e){} // ?theme=bandeira, handy for screenshots
  try{const v=localStorage.getItem("lonapreta-theme");if(THEMES[v])return v}catch(e){}
  return window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"bandeira":"night";
}
function applyTheme(name,persist){
  THEME=name;
  const el=document.documentElement;el.dataset.theme=name;el.lang=THEMES[name].html;
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content",THEMES[name].meta);
  if(persist){try{localStorage.setItem("lonapreta-theme",name)}catch(e){}}
}
function toggleTheme(){
  applyTheme(THEME==="night"?"bandeira":"night",true);
  if(!S)return;
  render();
  if(!ov.hidden&&curModal)md.innerHTML=curModal(); // re-translate an open modal in place
}
const themeBtn=()=>`<button class="btn tbtn" data-theme-toggle title="${tr("theme.title")}">${tr("theme.toggle")}</button>`;
applyTheme(initialTheme());

/* ===== 2. I18N =====
   One dictionary, two languages. EVERY key must exist in both `en` and `pt`
   (node scripts/check.mjs enforces this).
   - Placeholders: {name}. Pass values with tr("key",{name:...}).
   - Plurals: if you call tr("key",{n}) and n===1, the key "key_1" is used when it
     exists. Define "key" (many) and "key_1" (one) in BOTH languages.
   - HTML is allowed only as <b>..</b> and <em>..</em>. No attributes, no quotes.
   - Place names (Fazenda Santa Rita, Pontal do Paranapanema) and crop names
     (Feijão, Milho, Mandioca) are Portuguese in both languages on purpose. */

function tr(key,vars={}){
  const d=I18N[lang()];
  let s=(vars.n===1&&d[key+"_1"])||d[key];
  if(s==null)s=I18N.en[key];       // safety net only: check.mjs guarantees parity
  if(s==null)return key;           // a visible key means a typo in the code
  return s.replace(/\{(\w+)\}/g,(_,k)=>vars[k]??"");
}
const hasKey=k=>I18N[lang()][k]!=null;

/* ===== 3. DATA (rules, names, map geometry) ===== */
const RAINY=new Set([9,10,11,0,1,2]);   // month indexes 0=Jan; game starts in October (index 9)
const CROPS={
  feijao:{name:"Feijão",grow:2,yield:8,price:4},
  milho:{name:"Milho",grow:3,yield:12,price:2},
  mandioca:{name:"Mandioca",grow:5,yield:22,price:1.5}
};
const SEED_COST=2;
const NAMES=["Santa Rita","Boa Esperança","São José","Três Irmãos","Barra Funda","Pau-d'Arco","Água Limpa","Lagoa Seca","Bela Vista","Cachoeira Grande","Santa Clara","Bom Retiro","Capão Alto","Serra Velha","Primavera","Nova Aliança","Rio Claro","Santa Fé"];
const REGIONS=["Pontal do Paranapanema, SP","Sul do Pará","Zona da Mata, PE","Oeste do Paraná","Norte de Minas","Sertão da Bahia","Campanha Gaúcha","Bico do Papagaio, TO"];
/* Approximate [lon,lat] of each region, and a coarse outline of Brazil. Equirectangular, 400x410 viewBox (the map is drawn 395 tall; the rest leaves room for the label under the southernmost camp). */
const REGION_XY={"Pontal do Paranapanema, SP":[-52,-22.5],"Sul do Pará":[-50.5,-7],"Zona da Mata, PE":[-36,-8],"Oeste do Paraná":[-53.5,-25],
  "Norte de Minas":[-43.8,-16.5],"Sertão da Bahia":[-41.5,-11.5],"Campanha Gaúcha":[-54.5,-30.5],"Bico do Papagaio, TO":[-48,-5.5]};
const BR=[[-51.6,4.3],[-50,1.8],[-50.5,0.5],[-48.5,-0.5],[-46,-1],[-44.5,-2.5],[-41.8,-2.9],[-39,-3],[-37.2,-4.9],[-35.2,-5.3],[-34.8,-7.1],[-35,-9],
  [-36.4,-10.5],[-37.2,-11.5],[-38.5,-13],[-39,-15.5],[-39.2,-18],[-40,-20.5],[-41,-22],[-42,-23],[-44.5,-23.3],[-46.5,-24],[-48.5,-26],[-48.6,-28],
  [-50,-30.5],[-52,-32.5],[-53.4,-33.7],[-57.6,-30.2],[-56,-28.7],[-54,-27.2],[-54.6,-25.6],[-54.6,-24],[-54.3,-22.2],[-55.6,-22],[-57.9,-22.1],
  [-57.9,-20],[-57.8,-17.5],[-58.4,-16.3],[-60.2,-16.3],[-60,-14.4],[-62,-13],[-65,-11.5],[-66.5,-9.9],[-69.5,-10.9],[-70.5,-11],[-72.9,-9.5],
  [-73.7,-7.3],[-72.5,-7.5],[-70.8,-4.2],[-69.9,-4.2],[-69.5,-1],[-69.4,1],[-67.3,1.8],[-67,2.2],[-64,4.1],[-60,5.2],[-59.8,1.8],[-57,1.9],[-54,2.3]];
const geo=(lon,lat)=>[(lon+74)*10,(5.5-lat)*10];
const BR_PATH="M"+BR.map(([lo,la])=>geo(lo,la).map(v=>v.toFixed(1)).join(" ")).join("L")+"Z";
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];

/* ===== 4. STATE =====
   S is the whole saved game (JSON in localStorage "lonapreta"). Shape: docs/ARCHITECTURE.md.
   S.camps[] holds every camp (each is a land object plus its own families, money, stores and court case).
   S.cur is the camp on screen; K() returns it. A camp is "camp" (still fighting), "won" (a settlement) or "lost" (gone for good).
   curModal = function that builds the open modal's HTML. pending = modals waiting for their turn (neither is saved). */
let S, marketTab="sell", curModal=null, pending=[];
const CAMPS=4;
const K=()=>S.camps[S.cur];
const live=k=>k.state==="camp";
const short=n=>n.replace("Fazenda ","");

function genLand(region,name,dx,dy){
  const size=pick([9,12,12,16]);
  return {name:"Fazenda "+name,region,lon:REGION_XY[region][0]+dx,lat:REGION_XY[region][1]+dy,size,cols:size===9?3:4,
    fert:+rnd(.7,1.3).toFixed(2),idle:ri(2,20),owner:ri(15,60),growth:ri(1,4),vigil:+rnd(.5,1.5).toFixed(2),
    well:false,plots:Array.from({length:size},()=>({s:Math.random()<.8?"mato":"terra"}))};
}
/* A land plus everything that belongs to the camp living on it. Nothing is shared between camps. */
const makeCamp=l=>Object.assign(l,{state:"camp",families:2,labor:4,money:30,inv:{feijao:12,milho:12,mandioca:8,ovos:0},hens:3,chicks:[],goats:0,tools:0,
  discovered:false,cas:null,acted:{},sel:null});
/* n camps in n different regions, spaced out so their map markers do not touch. */
function genCamps(n,avoidRegions=[],avoidNames=[]){
  const names=NAMES.filter(x=>!avoidNames.includes("Fazenda "+x)).sort(()=>Math.random()-.5);
  const pool=REGIONS.filter(r=>!avoidRegions.includes(r));
  let regions;
  for(let tries=0;tries<200;tries++){
    regions=[...pool].sort(()=>Math.random()-.5).slice(0,n);
    const xy=[...avoidRegions,...regions].map(r=>geo(...REGION_XY[r]));
    if(xy.every((a,i)=>xy.every((b,j)=>j<=i||Math.hypot(a[0]-b[0],a[1]-b[1])>62)))break;
  }
  return regions.map((r,i)=>makeCamp(genLand(r,names[i],rnd(-.4,.4),rnd(-.4,.4))));
}
/* Labels derived from land numbers. They return TRANSLATED text, so call them at render time. */
const ownerKind=l=>tr(l.owner<30?"owner.heirs":l.owner<45?"owner.absentee":"owner.agro");
const fertLabel=l=>tr(l.fert<.9?"fert.poor":l.fert<1.1?"fert.fair":"fert.rich");
const vigilLabel=l=>tr(l.vigil<.8?"vigil.low":l.vigil<1.15?"vigil.mid":"vigil.high");
const monthOf=t=>tr("month."+((9+t)%12));
const yearOf=t=>2026+Math.floor((9+t)/12);
const rainy=()=>RAINY.has((9+S.t)%12);
const laborMax=k=>k.families*2+k.tools;
const active=k=>k.plots.filter(p=>p.s==="grow"||p.s==="ready").length;
function newPrices(){const o={};for(const k in CROPS)o[k]=+(CROPS[k].price*rnd(.8,1.2)).toFixed(2);o.ovos=+rnd(.8,1.2).toFixed(2);return o}

function newGame(){
  S={t:0,phase:"play",cur:0,camps:genCamps(CAMPS),log:[],prices:newPrices()};
  log("log.begin",{n:CAMPS},null);S.log[0].at=null;
  curModal=null;pending=[];
}
/* The log stores a KEY + vars (not text) so entries re-translate when the player switches mode.
   c = name of the camp the entry is about (null for news that is about all of them). */
function log(k,v,c=K()){S.log.unshift({k,v,at:S.t,c:c?c.name:null});S.log=S.log.slice(0,60)}
const logText=l=>{if(!l.k)return l.m;const v={...l.v};if(v.item)v.item=tr("shop."+v.item);return tr(l.k,v)};
const logWhen=l=>!l.k?l.when:l.at==null?tr("log.start"):monthOf(l.at)+" "+yearOf(l.at);
function save(){try{localStorage.setItem("lonapreta",JSON.stringify(S))}catch(e){}}

/* ===== 5. PLOT ART (inline SVG; colours come from --art-* variables, constant in both themes) ===== */
function art(p){
  const soil=`<g stroke="var(--soil-line)" stroke-width="2" fill="none" opacity=".7"><path d="M4 18 Q30 14 56 18"/><path d="M4 30 Q30 26 56 30"/><path d="M4 42 Q30 38 56 42"/><path d="M4 54 Q30 50 56 54"/></g>`;
  if(p.s==="mato") return `<svg viewBox="0 0 60 60"><g stroke="var(--art-leaf-dim)" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M6 56 L9 40 L12 56 M14 56 L18 30 L21 56 M24 56 L27 42 L31 56 M33 56 L37 28 L40 56 M42 56 L45 38 L49 56 M50 56 L53 34 L56 56"/>
    <path d="M10 26 L13 14 L16 26 M30 22 L33 8 L36 22 M44 24 L48 12 L50 24" opacity=".7"/></g></svg>`;
  if(p.s==="terra") return `<svg viewBox="0 0 60 60">${soil}</svg>`;
  const c=CROPS[p.crop], pr=Math.min(1,(p.age+(p.s==="ready"?1:0))/c.grow), h=6+pr*30, xs=[15,30,45];
  let g="";
  for(const x of xs){
    const b=50, top=b-h;
    if(p.crop==="milho"){
      g+=`<path d="M${x} ${b} L${x} ${top}" stroke="var(--art-leaf)" stroke-width="2.4"/>
      <path d="M${x} ${b-h*.4} q-8 -4 -10 2 M${x} ${b-h*.7} q8 -4 10 2" stroke="var(--art-leaf)" stroke-width="2" fill="none"/>`;
      if(p.s==="ready") g+=`<ellipse cx="${x+3}" cy="${b-h*.55}" rx="2.6" ry="6" fill="var(--art-corn)"/>`;
    } else if(p.crop==="feijao"){
      g+=`<path d="M${x} ${b} L${x} ${top}" stroke="var(--art-leaf)" stroke-width="2"/>
      <circle cx="${x-5}" cy="${top+4}" r="${2+pr*3}" fill="var(--art-leaf)"/><circle cx="${x+5}" cy="${top+8}" r="${2+pr*3}" fill="var(--art-leaf)"/>`;
      if(p.s==="ready") g+=`<path d="M${x+2} ${b-8} q4 6 1 10" stroke="#d8c08a" stroke-width="2.4" fill="none"/>`;
    } else {
      g+=`<path d="M${x} ${b} L${x} ${top+4}" stroke="#a0603e" stroke-width="2.2"/>`;
      for(const a of [-50,-25,0,25,50]){const r=(4+pr*8),rad=(a-90)*Math.PI/180;
        g+=`<path d="M${x} ${top+4} L${(x+Math.cos(rad)*r).toFixed(1)} ${(top+4+Math.sin(rad)*r).toFixed(1)}" stroke="var(--art-leaf)" stroke-width="2.4" stroke-linecap="round"/>`;}
      if(p.s==="ready") g+=`<path d="M${x-4} ${b+2} q4 6 8 0" stroke="#c9905e" stroke-width="3" fill="none"/>`;
    }
  }
  return `<svg viewBox="0 0 60 60">${soil}<g fill="none">${g}</g></svg>`;
}
const plotLabel=p=>p.s==="mato"?tr("plot.scrub"):p.s==="terra"?tr("plot.cleared"):p.s==="ready"?tr("plot.harvest"):CROPS[p.crop].name+" "+p.age+"/"+CROPS[p.crop].grow;

/* ===== 6. RENDER (main screen; rebuilds #app from S every time) ===== */
const whenOf=t=>monthOf(t)+" "+yearOf(t);
const statusOf=k=>k.state==="won"?tr("tab.won"):k.state==="lost"?tr("tab.lost"):k.cas?tr("tab.hearing",{n:k.cas.months}):tr("tab.quiet");
/* One button per camp, always visible, so a hearing coming up in another camp is never out of sight. */
const campTabs=()=>`<nav class="camps" aria-label="${tr("camps.aria")}">${S.camps.map((k,i)=>{
  const st=statusOf(k), cls=live(k)?(k.cas?"hearing":"quiet"):k.state;
  return `<button class="btn ${cls}${i===S.cur?" on":""}" data-camp="${i}" aria-pressed="${i===S.cur}" aria-label="${tr("tab.aria",{name:k.name,status:st})}"><span class="n">${short(k.name)}</span><small>${st}</small></button>`}).join("")}</nav>`;
const banner=k=>k.state==="won"
  ?`<div class="landc won"><strong>${tr("map.won")}</strong><span class="calm">${tr("camp.wonNote",{name:k.name,fam:k.families,when:whenOf(k.endT)})}</span></div>`
  :`<div class="landc lost"><strong>${tr("map.lost")}</strong><span class="calm">${tr(k.why==="hunger"?"camp.lostHunger":"camp.lostEvicted",{name:k.name,when:whenOf(k.endT)})}</span></div>`;

function render(){
  const k=K(), app=document.getElementById("app");
  const title=`<h1>Lona <span>Preta</span></h1>`;
  const p=k.sel!=null?k.plots[k.sel]:null;
  let acts="";
  if(!p) acts=`<span class="calm">${tr("act.tap")}</span>`;
  else if(p.s==="mato") acts=`<button class="btn" data-a="clear" ${k.labor<1?"disabled":""}>${tr("act.clear")}<small>${tr("act.laborCost")}</small></button>`;
  else if(p.s==="terra") acts=Object.keys(CROPS).map(c=>`<button class="btn" data-a="plant" data-c="${c}" ${k.labor<1||k.inv[c]<SEED_COST?"disabled":""}>${tr("act.plant",{crop:CROPS[c].name})}<small>${tr("act.plantCost",{grow:CROPS[c].grow,seed:SEED_COST})}</small></button>`).join("");
  else if(p.s==="ready") acts=`<button class="btn corn" data-a="harvest" ${k.labor<1?"disabled":""}>${tr("act.harvest",{crop:CROPS[p.crop].name})}<small>${tr("act.laborCost")}</small></button>`;
  else acts=`<span class="calm">${tr("act.growing",{crop:CROPS[p.crop].name,n:CROPS[p.crop].grow-p.age})}${p.f<1?tr("act.dryHalf"):""}</span>`;

  const C=k.cas;
  const caseHtml=!live(k)?"":C?`<div class="panel case"><div class="landhead"><h3>${tr("case.title")}</h3><span class="label">${tr("case.hearing",{n:C.months})}</span></div>
    <div class="meter"><span>${tr("case.defense")}</span><div class="track"><i style="width:${Math.min(100,C.defense/Math.max(C.defense,C.owner,1)*100)}%;background:var(--leaf)"></i></div><b>${Math.round(C.defense)}</b></div>
    <div class="meter"><span>${tr("case.owner")}</span><div class="track"><i style="width:${Math.min(100,C.owner/Math.max(C.defense,C.owner,1)*100)}%;background:var(--clay)"></i></div><b>${Math.round(C.owner)}</b></div>
    <span class="calm">${tr("case.note",{n:defenseTick(k)})}</span>
    <div class="actions">
      <button class="btn" data-a="lawyer" ${k.acted.lawyer||k.money<30?"disabled":""}>${tr("case.lawyer")}<small>${tr("case.lawyerCost")}</small></button>
      <button class="btn" data-a="laudo" ${C.laudo||k.money<60?"disabled":""}>${tr("case.laudo")}<small>${tr("case.laudoCost",{n:k.idle*2})}</small></button>
      <button class="btn" data-a="mob" ${k.acted.mob||k.labor<3?"disabled":""}>${tr("case.mob")}<small>${tr("case.mobCost")}</small></button>
    </div></div>`
    :`<div class="panel case"><div class="landhead"><h3 style="color:var(--leaf)">${tr("case.quiet")}</h3><span class="label">${k.discovered?"":tr("case.undiscovered")}</span></div>
      <span class="calm">${tr("case.quietNote",{vigil:vigilLabel(k)})}</span></div>`;

  const grid=live(k)
    ?`<div class="grid" style="grid-template-columns:repeat(${k.cols},minmax(0,1fr))">${k.plots.map((q,i)=>`<button class="plot ${k.sel===i?"sel":""} ${q.s}" data-p="${i}" aria-label="${tr("plot.aria",{i:i+1,label:plotLabel(q)})}">${art(q)}<span class="badge">${plotLabel(q)}</span></button>`).join("")}</div>`
    :k.state==="won"
    ?`<div class="grid" style="grid-template-columns:repeat(${k.cols},minmax(0,1fr))">${k.plots.map((q,i)=>`<div class="plot ${q.s}" role="img" aria-label="${tr("plot.aria",{i:i+1,label:plotLabel(q)})}">${art(q)}<span class="badge">${plotLabel(q)}</span></div>`).join("")}</div>`
    :"";
  const settled=S.camps.filter(c=>c.state==="won").length;

  app.innerHTML=`
  <header class="top">
    <div>${title}<div class="tag">${tr("app.tagline")}</div></div>
    <div class="status">
      <span class="chip ${rainy()?"rain":"dry"}">${monthOf(S.t)} ${yearOf(S.t)} <b>${rainy()?tr("stat.rain"):tr("stat.dry")}</b></span>
      <span class="chip">${tr("stat.settled")} <b>${settled}/${S.camps.length}</b></span>
      <span class="chip">${tr("stat.families")} <b>${k.families}</b></span>
      ${live(k)?`<span class="chip">${tr("stat.labor")} <b>${k.labor}/${laborMax(k)}</b></span>`:""}
      <span class="chip">R$ <b>${k.money.toFixed(0)}</b></span>
      ${themeBtn()}
    </div>
  </header>
  ${campTabs()}
  <div class="cols">
    <div class="panel">
      <div class="landhead"><h2>${k.name}</h2><span class="label">${k.region}</span></div>
      <div class="facts"><span>${tr("land.yrsUnused",{n:k.idle})}</span><span><b>${fertLabel(k)}</b></span><span>${tr("land.owner",{kind:ownerKind(k)})}</span>${k.well?`<span><b>${tr("land.well")}</b></span>`:""}</div>
      ${live(k)?"":banner(k)}
      ${grid}
      ${live(k)?`<div class="actions">${acts}</div>`:""}
      <div class="bar">
        ${live(k)?`<button class="btn" data-a="market">${tr("act.market")}</button>`:""}
        <button class="btn go" data-a="next">${tr("act.next")}</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      ${caseHtml}
      <div class="panel"><div class="landhead"><span class="label">${tr("map.title")}</span><span class="label">${live(k)?tr("map.inProd",{a:active(k),b:k.size}):k.state==="won"?tr("map.won"):tr("map.lost")}</span></div>${mapHtml()}
        <span class="calm">${tr("map.hint")}</span></div>
      ${k.state==="lost"?"":`<div class="panel"><span class="label">${tr("store.title")}</span>
        <div class="inv">
          ${Object.keys(CROPS).map(c=>`<div><b>${k.inv[c]}</b>${CROPS[c].name}<span>${tr("crop."+c+".gloss")}</span></div>`).join("")}
          <div><b>${k.inv.ovos}</b>${tr("store.eggs")}</div>
          <div><b>${k.hens}</b>${tr("store.hens")}${k.chicks.length?tr("store.chicks",{n:k.chicks.length}):""}</div>
          ${k.goats?`<div><b>${k.goats}</b>${tr("store.goats")}</div>`:""}
          ${k.tools?`<div><b>${k.tools}</b>${tr("store.hoes")}</div>`:""}
        </div>
        <span class="calm">${tr("store.eat",{n:k.families*2})}</span>
      </div>`}
      <div class="panel"><span class="label">${tr("log.title")}</span>
        <ul class="log">${S.log.slice(0,16).map(l=>`<li><span class="m">${logWhen(l)}</span>${l.c?`<b>${short(l.c)}</b> `:""}${logText(l)}</li>`).join("")}</ul>
      </div>
      <details class="panel"><summary>${tr("howto.title")}</summary>
        <ul>${[1,2,3,4,5,6,7].map(i=>`<li>${tr("howto."+i)}</li>`).join("")}</ul>
      </details>
    </div>
  </div>`;
}

/* ===== 7. MAP =====
   One SVG of Brazil with every camp on it. Tap a marker to go to that camp.
   Draw order: the camp on screen is drawn last. A ring shows plots in production, yellow = settlement, ✕ = lost. */
const ll=l=>{const r=REGION_XY[l.region]||[-52,-15];return [l.lon??r[0],l.lat??r[1]]};
const pos=l=>geo(...ll(l));
const CIRC=2*Math.PI*7;
const campTip=k=>k.state==="won"?tr("map.tipWon",{name:k.name}):k.state==="lost"?tr("map.tipLost",{name:k.name}):tr("map.tipCamp",{name:k.name,a:active(k),b:k.size});
function mapHtml(){
  let m="";
  [...S.camps.keys()].sort((a,b)=>(a===S.cur)-(b===S.cur)).forEach(i=>{
    const k=S.camps[i],[x,y]=pos(k),on=i===S.cur,tip=campTip(k);
    const edge=x>330?"end":x<70?"start":"middle", tx=edge==="end"?x+14:edge==="start"?x-14:x, ty=y+31;
    let mark;
    if(k.state==="lost") mark=`<circle cx="${x}" cy="${y}" r="14" fill="var(--tarp-3)" stroke="var(--clay)" stroke-width="1.5"/>
      <path d="M${x-6} ${y-6}L${x+6} ${y+6}M${x+6} ${y-6}L${x-6} ${y+6}" stroke="var(--clay)" stroke-width="3" stroke-linecap="round"/>`;
    else{
      const won=k.state==="won", frac=won?1:active(k)/k.size;
      mark=`<circle cx="${x}" cy="${y}" r="14" fill="var(--clay)"/>
        <circle cx="${x}" cy="${y}" r="7" fill="none" stroke="var(--leaf)" stroke-width="14" stroke-dasharray="${(frac*CIRC).toFixed(2)} ${CIRC.toFixed(2)}" transform="rotate(-90 ${x} ${y})"/>
        <circle cx="${x}" cy="${y}" r="14" fill="none" stroke="${won?"var(--corn)":"var(--chalk)"}" stroke-width="${won?3:1.5}"/>`;
    }
    m+=`<g data-camp="${i}" class="cand${on?" on":""}" tabindex="0" role="button" aria-label="${tip}"><title>${tip}</title>
      ${on?`<circle cx="${x}" cy="${y}" r="19" fill="none" stroke="var(--accent)" stroke-width="2"/>`:""}${mark}
      <text class="${on?"c":""}" x="${tx}" y="${ty}" text-anchor="${edge}">${short(k.name)}</text></g>`});
  return `<svg class="map" viewBox="0 0 400 410" role="img" aria-label="${tr("map.aria")}"><path d="${BR_PATH}" class="br"/>${m}</svg>
    <div class="legend"><span><i style="background:var(--clay)"></i>${tr("map.legendCamp")}</span><span><i style="background:var(--leaf)"></i>${tr("map.legendProd")}</span><span><i style="background:var(--corn)"></i>${tr("map.legendWon")}</span><span><b style="color:var(--clay)">✕</b> ${tr("map.legendLost")}</span></div>`;
}
const defenseTick=k=>Math.round(active(k)*.6+k.families*.5);

/* ===== 8. ACTIONS (clicks and keys) ===== */
document.addEventListener("click",e=>{
  if(e.target.closest("[data-theme-toggle]")){toggleTheme();return}
  const cb=e.target.closest("[data-camp]"); if(cb){S.cur=+cb.dataset.camp;save();render();return}
  const pb=e.target.closest("[data-p]"); if(pb){K().sel=+pb.dataset.p;render();return}
  const b=e.target.closest("[data-a]"); if(!b||b.disabled)return;
  const a=b.dataset.a, k=K(), p=k.sel!=null?k.plots[k.sel]:null;
  switch(a){
    case "clear": p.s="terra";k.labor--;break;
    case "plant":{const c=b.dataset.c;k.inv[c]-=SEED_COST;k.labor--;Object.assign(p,{s:"grow",crop:c,age:0,f:(rainy()||k.well)?1:.5});break}
    case "harvest":{const n=Math.round(CROPS[p.crop].yield*k.fert*p.f);k.inv[p.crop]+=n;log("log.harvest",{n,crop:CROPS[p.crop].name});p.s="terra";delete p.crop;k.labor--;break}
    case "lawyer": k.money-=30;k.cas.defense+=6;k.acted.lawyer=1;log("log.lawyer");break;
    case "laudo": k.money-=60;k.cas.defense+=k.idle*2;k.cas.laudo=1;log("log.laudo",{n:k.idle});break;
    case "mob": k.labor-=3;k.cas.defense+=5;k.acted.mob=1;log("log.mob");break;
    case "market": marketTab="sell";openMarket();return;
    case "next": endMonth();save();render();pump();return;
  }
  save();render();
});
document.addEventListener("keydown",e=>{ // make SVG map markers keyboard-operable
  if((e.key==="Enter"||e.key===" ")&&e.target.matches?.("[data-camp]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});

/* ===== 9. MONTH LOOP (food, chickens, events, court cases) =====
   endMonth() moves EVERY camp that is still fighting forward one month. Camps that are won or lost are frozen. */
function eat(k,milk){
  let need=k.families*2;
  const use=n=>{const u=Math.min(n,need);need-=u;return u};
  use(milk);
  for(const c of ["ovos","mandioca","milho","feijao"]) k.inv[c]-=use(k.inv[c]);
  if(need>0){k.families--;log("log.hunger",null,k);}
}
function chickens(k){
  if(k.hens>0){
    const corn=Math.ceil(k.hens/3), fed=k.inv.milho>=corn;
    if(fed)k.inv.milho-=corn;
    k.inv.ovos+=k.hens*(fed?3:1);
  }
  k.chicks=k.chicks.map(a=>a+1);
  const grown=k.chicks.filter(a=>a>=2).length; k.chicks=k.chicks.filter(a=>a<2); k.hens+=grown;
  if(k.hens>=2){const n=ri(0,Math.ceil(k.hens/4));for(let i=0;i<n;i++){k.chicks.push(0);k.inv.ovos=Math.max(0,k.inv.ovos-1)}}
}
/* Each event changes one camp and returns [logKey, vars] (or nothing when it does not apply). */
const EVENTS=[
  k=>{if(!k.hens)return;const n=ri(1,Math.ceil(k.hens/3));k.hens-=n;return ["ev.fox",{n}]},
  k=>{if(!active(k))return;k.plots.forEach(p=>{if(p.s==="grow")p.age=Math.min(p.age+1,CROPS[p.crop].grow-1)});return ["ev.rain"]},
  k=>{if(!active(k))return;k.plots.forEach(p=>{if(p.s==="grow")p.f*=.8});return ["ev.drySpell"]},
  k=>{const n=ri(20,60);k.money+=n;return ["ev.union",{n}]},
  k=>{if(k.cas){k.cas.defense+=6;return ["ev.press"]}},
  k=>{k.inv.feijao+=5;k.inv.milho+=5;return ["ev.seeds"]},
  k=>{if(k.families>=8)return;k.families++;return ["ev.family"]},
  k=>{k.fert=+(k.fert+.05).toFixed(2);return ["ev.soil"]}
];
function tickCamp(k){
  k.plots.forEach(p=>{if(p.s==="grow"){p.age++;if(p.age>=CROPS[p.crop].grow)p.s="ready"}});
  chickens(k);
  eat(k,k.goats*3);
  if(k.families<=0){lose(k,"hunger");return}
  const food=k.inv.ovos+k.inv.mandioca+k.inv.milho+k.inv.feijao;
  if(food>=k.families*10&&k.families<8&&Math.random()<.3){k.families++;log("log.eatsWell",null,k)}
  legal(k);
  if(!live(k))return;
  if(Math.random()<.3){const ev=pick(EVENTS)(k);if(ev)log(ev[0],ev[1],k)}
}
function endMonth(){
  if(S.phase!=="play")return;
  S.prices=newPrices();
  if(Math.random()<.08){for(const c in S.prices)S.prices[c]=+(S.prices[c]*1.5).toFixed(2);log("ev.fair",null,null)} // one fair for everybody
  S.camps.filter(live).forEach(tickCamp);
  S.t++;
  S.camps.filter(live).forEach(k=>{k.acted={};k.labor=laborMax(k)});
  if(!S.camps.some(live)){S.phase="over";notice(endModal)}
}
function legal(k){
  if(!k.discovered){
    const pr=.03+.015*active(k)*k.vigil+(k.hens>12?.02:0);
    if(Math.random()<pr){
      k.discovered=true;
      k.cas={owner:k.owner+ri(0,8),defense:Math.round(k.idle*1.5),months:6,laudo:0};
      log("log.discovered",null,k);
      notice(info("info.ownerTitle","info.ownerBody",()=>({name:k.name,kind:ownerKind(k)})));
    }
    return;
  }
  const C=k.cas;
  C.defense+=defenseTick(k); C.owner+=k.growth; C.months--;
  if(C.months<=0){
    if(C.defense>=C.owner){
      k.state="won";k.endT=S.t+1;k.cas=null;
      log("log.won",{name:k.name},k);
      notice(info("info.wonTitle","info.wonBody",()=>({name:k.name,fam:k.families})));
    }else lose(k,"evicted");
  }
}
/* A camp that is lost stays lost: the families are gone and the land goes back to its owner. */
function lose(k,why){
  k.state="lost";k.why=why;k.endT=S.t+1;k.cas=null;
  log(why==="hunger"?"log.disbanded":"log.evicted",{name:k.name},k);
  notice(why==="hunger"?info("info.hungerTitle","info.hungerBody",()=>({name:k.name})):info("info.evictTitle","info.evictBody",()=>({name:k.name})));
}

/* ===== 10. MODALS =====
   show(fn) takes a FUNCTION that returns the modal HTML, so toggleTheme() can rebuild it in the other language.
   Read state inside fn (not before it), otherwise a re-render would show stale numbers.
   Several camps can have news in one month: notice(fn) queues a modal and pump() shows the next one when the last is closed. */
const ov=document.getElementById("ov"), md=document.getElementById("modal");
function show(fn){curModal=fn;md.innerHTML=fn();ov.hidden=false}
function hide(){curModal=null;ov.hidden=true;render();pump()}
const notice=fn=>pending.push(fn);
function pump(){if(ov.hidden&&pending.length)show(pending.shift())}
const info=(titleKey,bodyKey,varsFn)=>()=>{const v=varsFn();
  return `${themeBtn()}<h2>${tr(titleKey,v)}</h2><p>${tr(bodyKey,v)}</p><div class="bar"><button class="btn go" id="okb">${tr("info.ok")}</button></div>`};
md.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.disabled)return;
  if(b.id==="okb"){hide();return}
  const d=b.dataset;
  if(d.close){hide();return}
  if(d.tab){marketTab=d.tab;openMarket();return}
  if(d.sell){const k=K(),c=d.sell,n=Math.min(+d.n,k.inv[c]);k.inv[c]-=n;k.money+=n*S.prices[c];save();openMarket();return}
  if(d.buy){buy(d.buy);save();openMarket();return}
  if(d.restart){newGame();save();hide();return}
});
ov.addEventListener("click",e=>{if(e.target===ov&&curModal!==endModal)hide()});

/* Shop: label = tr("shop."+k), optional note = tr("shop."+k+".note"). Every item is bought by, and for, the camp on screen. */
const SHOP=[
  {k:"feijao",cost:()=>Math.ceil(S.prices.feijao*1.5*5),do:k=>k.inv.feijao+=5},
  {k:"milho",cost:()=>Math.ceil(S.prices.milho*1.5*5),do:k=>k.inv.milho+=5},
  {k:"mandioca",cost:()=>Math.ceil(S.prices.mandioca*1.5*5),do:k=>k.inv.mandioca+=5},
  {k:"hen",cost:()=>15,do:k=>k.hens++},
  {k:"goat",cost:()=>60,do:k=>k.goats++},
  {k:"hoe",cost:()=>30,do:k=>k.tools++},
  {k:"well",cost:()=>80,do:k=>k.well=true,once:k=>k.well}
];
function buy(id){const k=K(),it=SHOP.find(x=>x.k===id),c=it.cost();if(k.money>=c){k.money-=c;it.do(k);log("log.bought",{item:id})}}
function openMarket(){show(()=>{
  const k=K();
  const sell=["feijao","milho","mandioca","ovos"].map(c=>{const nm=c==="ovos"?tr("store.eggs"):CROPS[c].name;
    return `<div class="row"><span>${nm} <span class="calm">· ${k.inv[c]} · R$${S.prices[c].toFixed(2)}</span></span><span class="ctl">
    <button class="btn" data-sell="${c}" data-n="1" ${k.inv[c]<1?"disabled":""}>${tr("market.sell1")}</button>
    <button class="btn" data-sell="${c}" data-n="10" ${k.inv[c]<1?"disabled":""}>${tr("market.sell10")}</button></span></div>`}).join("");
  const buyH=SHOP.map(it=>{const done=it.once&&it.once(k),nk="shop."+it.k+".note";return `<div class="row"><span>${tr("shop."+it.k)}${hasKey(nk)?` <span class="calm">· ${tr(nk)}</span>`:""}</span><span class="ctl">
    <button class="btn" data-buy="${it.k}" ${done||k.money<it.cost()?"disabled":""}>${done?tr("market.done"):"R$"+it.cost()}</button></span></div>`}).join("");
  return `${themeBtn()}<div class="landhead"><h2>${tr("market.title")}</h2><span class="chip">${short(k.name)} · R$ <b>${k.money.toFixed(2)}</b></span></div>
  <p>${tr("market.note",{n:k.families*2})}</p>
  <div class="tabs"><button class="btn ${marketTab==="sell"?"on":""}" data-tab="sell">${tr("market.sell")}</button><button class="btn ${marketTab==="buy"?"on":""}" data-tab="buy">${tr("market.buy")}</button></div>
  <div>${marketTab==="sell"?sell:buyH}</div>
  <div class="bar"><button class="btn go" data-close="1">${tr("market.back")}</button></div>`})}

/* The last screen: every camp is now a settlement or lost. */
const END_TEXT={all:["end.titleAll","end.bodyAll"],some:["end.titleSome","end.bodySome"],none:["end.titleNone","end.bodyNone"]};
const endModal=()=>{
  const won=S.camps.filter(c=>c.state==="won"), n=S.camps.length, fam=won.reduce((s,c)=>s+c.families,0);
  const [tk,bk]=END_TEXT[won.length===n?"all":won.length?"some":"none"], v={w:won.length,total:n,fam,t:S.t};
  return `${themeBtn()}<h2>${tr(tk,v)}</h2>
  <p>${tr(bk,v)}</p>
  <div class="inv"><div><b>${S.t}</b>${tr("end.months")}</div><div><b>${won.length}</b>${tr("end.won")}</div><div><b>${n-won.length}</b>${tr("end.lost")}</div><div><b>${fam}</b>${tr("end.families")}</div></div>
  <div class="bar"><button class="btn go" data-restart="1">${tr("end.restart")}</button></div>`};

/* ===== 11. BOOT ===== */
/* Saves from before there were several camps: one land in S.land plus loose families/money/stores. The old camp
   becomes camp 0 and three new camps start next to it. */
function upgradeOld(){
  const L=S.land;
  if(!L){newGame();return}
  const camp=Object.assign(L,{state:S.phase==="won"?"won":S.phase==="lost"||S.phase==="evict"?"lost":"camp",why:S.phase==="lost"?"hunger":"evicted",endT:S.t,
    families:S.families,labor:S.labor,money:S.money,inv:S.inv,hens:S.hens,chicks:S.chicks||[],goats:S.goats||0,tools:S.tools||0,
    discovered:!!S.discovered,cas:S.cas||null,acted:S.acted||{},sel:S.sel??null});
  if(camp.state!=="camp")camp.cas=null;
  S={t:S.t,phase:"play",cur:0,camps:[camp,...genCamps(CAMPS-1,[L.region],[L.name])],log:S.log||[],prices:S.prices||newPrices()};
}
function start(data){
  S=data&&data.S;
  if(!S){try{S=JSON.parse(localStorage.getItem("lonapreta"))}catch(e){S=null}}
  if(!S||!(S.camps||S.inv))newGame();
  else if(!S.camps)upgradeOld();
  if(S.cur==null||!S.camps[S.cur])S.cur=0;
  if(!S.camps.some(live))S.phase="over";
  render();
  if(S.phase==="over")show(endModal);
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
